[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tickyticker"
version = "0.1.0"
description = "Charge-state region mapping for timsTOF MS1 data"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "tickyticker contributors" }]
dependencies = [
    "numba>=0.60",
    "numpy>=2.0",
    "opentimspy>=1.2.0",
]
[project.optional-dependencies]
dev = ["matplotlib>=3.8"]
[project.scripts]
charge-regions = "tickyticker.charge_regions:main"
below-line-tic = "tickyticker.charge_regions:tic_main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
